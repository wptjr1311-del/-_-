/* =========================================================

const KEY = "derna-global-cs-v3";
const DEF = { lang:"en", sec:"checkin", pinyin:true, picks:{} };
let S = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) { return { ...DEF }; } })();
if (!LANGS[S.lang]) S.lang = "en";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ lang:S.lang, sec:S.sec, pinyin:S.pinyin, picks:S.picks })); } catch(e) {} };
let modalId = null;

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lbl = (o, L) => o[L] || o.all || o.en;

  }).join("");

  document.getElementById("settingsLbl").innerHTML = `<i data-lucide="settings" class="w-3.5 h-3.5"></i>${bi("settings")}`;
  document.getElementById("footer").innerHTML = `© DERNA CLINIC<br>${UI.footer.ko} · ${esc(UI.footer[S.lang])}`;

/* 고객 응답 결과 박스 (한국어 먼저 → 외국어) */
function replyBox(obj, big) {
  const L = S.lang;
  return `<div class="mt-3 rounded-2xl bg-lemon-50 border border-lemon-300 p-4 flex gap-3 items-start fade">
    <div class="flex-1 min-w-0">
      <div class="text-[11.5px] font-black tracking-wide text-lemon-600 mb-1 flex items-center gap-1"><i data-lucide="message-circle-reply" class="w-3.5 h-3.5"></i>${bi("answer")}</div>
      <p class="${big ? "text-[18px]" : "text-[15px]"} font-semibold text-char-700">${esc(obj.ko)}</p>
      <p lang="${LANGS[L].html}" class="${big ? "text-[24px]" : "text-[18px]"} text-char-900 font-bold mt-1 leading-snug">${esc(obj[L])}</p>
      ${L === "zh" && S.pinyin && obj.py ? `<p class="text-[13px] text-char-400 mt-1">${esc(obj.py)}</p>` : ""}
    </div>
  </div>`;
}

function chip(on, ko, tgt, act, id, val, big) {
  return `<button data-act="${act}" data-id="${id}" data-val="${val}" class="chip ${on ? "on" : ""} ${big ? "!min-h-[70px] !px-5" : ""}">
    <span class="sub block ${big ? "text-[14px]" : "text-[12px]"} text-char-400 font-semibold">${esc(ko)}</span>
    <span class="block ${big ? "text-[20px]" : "text-[16px]"} font-bold leading-snug">${esc(tgt)}</span></button>`;
}

function pickerHTML(ln, big) {
  const L = S.lang, id = ln.id, v = S.picks[id];
  const wrap = (title, inner, ic = "hand") => `
    <div class="mt-4 rounded-2xl bg-char-50 border border-char-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[13px] font-bold text-char-700 flex items-center gap-2"><span class="w-7 h-7 rounded-lg bg-lemon text-char-900 flex items-center justify-center shrink-0"><i data-lucide="${ic}" class="w-4 h-4"></i></span><span>${title}</span></span>
        ${v ? `<button data-act="clear" data-id="${id}" class="text-[12.5px] text-char-400 font-semibold px-2 py-1 flex items-center gap-1"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>${bi("reset")}</button>` : ""}
      </div>${inner}</div>`;

  if (ln.pick === "flowmap") {
    return `<div class="mt-4 grid grid-cols-5 gap-2">${FLOW_STEPS.map((f, i) => `
      <div class="rounded-2xl bg-white border border-char-200 p-3 text-center relative">
        <div class="mx-auto w-11 h-11 rounded-xl ${i === FLOW_STEPS.length - 1 ? "bg-lemon text-char-900" : "bg-char-800 text-lemon"} flex items-center justify-center mb-1.5"><i data-lucide="${f.icon}" class="w-5 h-5"></i></div>
        <div class="text-[10px] font-black text-char-400">${i+1}</div>
        <div class="text-[13px] font-bold">${f.ko}</div>
        <div lang="${LANGS[L].html}" class="text-[12.5px] text-char-600 font-semibold leading-tight mt-0.5">${esc(f[L])}</div>
      </div>`).join("")}</div>`;
  }

  if (ln.pick === "companion") {
    const chips = COMPANION_OPTIONS.map(o => chip(v === o.id, o.ko, o[L], "pick", id, o.id, big)).join("");
    const reply = v ? replyBox(v === "cancel" ? COMPANION_REPLY.cancel : COMPANION_REPLY.wait, big) : "";
    return wrap(bi("pickCompanion"), `<div class="grid grid-cols-2 gap-2">${chips}</div>${reply}`, "users");
  }

  if (ln.pick === "wait") {
    const chips = WAIT_OPTIONS.map(o => chip(v === o.id, o.ko, o[L], "pick", id, o.id, big)).join("");
    let reply = "";
    if (v) {
      const o = WAIT_OPTIONS.find(x => x.id === v);
      const obj = { ko: WAIT_TPL.ko.replace("{t}", o.ko) };
      L_KEYS.forEach(k => obj[k] = WAIT_TPL[k].replace("{t}", o[k]));
      reply = replyBox(obj, big);
    }
    return wrap(bi("pickWait"), `<div class="grid grid-cols-2 lg:grid-cols-4 gap-2">${chips}</div>${reply}`, "timer");
  }

  if (ln.pick === "cert" || ln.pick === "rx") {
    const list = ln.pick === "cert" ? CERT_OPTIONS : RX_OPTIONS;
    const sel = Array.isArray(v) ? v : [];
    const chips = list.map(o => chip(sel.includes(o.id), o.ko, lbl(o, L), "multi", id, o.id, big)).join("");
    const picked = list.filter(o => sel.includes(o.id));
    const summary = picked.length ? `
      <div class="mt-3 rounded-2xl bg-lemon-50 border border-lemon-300 p-4 fade">
        <div class="text-[11px] font-black tracking-widest text-lemon-600 mb-2">${bi(ln.pick === "cert" ? "certLabel" : "rxLabel")}</div>
        <div class="flex flex-wrap gap-2">${picked.map(o => `
          <span class="inline-flex flex-col rounded-xl bg-white border border-char-200 px-3.5 py-2">
            <span class="text-[11.5px] text-char-400 font-semibold">${esc(o.ko)}</span>
            <span lang="${LANGS[L].html}" class="${big ? "text-[22px]" : "text-[17px]"} font-extrabold text-char-900">${esc(lbl(o, L))}</span>
          </span>`).join("")}</div>
      </div>` : "";
    return wrap(`${bi(ln.pick === "cert" ? "pickCert" : "pickRx")} <span class="font-semibold text-char-400">(${bi("multi")})</span>`,
      `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">${chips}</div>${summary}`, ln.pick === "cert" ? "badge-check" : "pill");
  }

  if (ln.pick === "departure") {
    const d = (v && typeof v === "object") ? v : {};
    const AP = { am:{ en:"AM", zh:"上午", ja:"午前", ru:"До обеда", th:"ช่วงเช้า" }, pm:{ en:"PM", zh:"下午", ja:"午後", ru:"После обеда", th:"ช่วงบ่าย" } };
    const apBtn = (k, ko) => chip(d.ap === k, ko, AP[k][L], "dep", id, `ap:${k}`, big);
    const hourBtns = Array.from({length:12}, (_, i) => i + 1).map(h => `<button data-act="dep" data-id="${id}" data-val="h:${h}" class="tbtn ${d.h === h ? "on" : ""}">${h}</button>`).join("");
    const minBtns = [0, 15, 30, 45].map(m => `<button data-act="dep" data-id="${id}" data-val="m:${m}" class="tbtn ${d.m === m ? "on" : ""}">:${String(m).padStart(2,"0")}</button>`).join("");
    const reasons = DEP_REASONS.map(o => chip(d.r === o.id, o.ko, o[L], "dep", id, `r:${o.id}`, big)).join("");

    let summary = "";
    const hasTime = d.ap && d.h;
    if (hasTime || d.r) {
      const mm = String(d.m ?? 0).padStart(2, "0");
      const h24 = d.ap === "pm" ? (d.h % 12) + 12 : d.h % 12;
      const timeFmt = {
        ko:`${d.ap === "am" ? "오전" : "오후"} ${d.h}:${mm}`,
        en:`${d.h}:${mm} ${d.ap === "am" ? "AM" : "PM"}`,
        zh:`${d.ap === "am" ? "上午" : "下午"}${d.h}:${mm}`,
        ja:`${d.ap === "am" ? "午前" : "午後"}${d.h}:${mm}`,
        ru:`${String(h24).padStart(2,"0")}:${mm}`,
        th:`${String(h24).padStart(2,"0")}:${mm} น.`
      };
      const r = DEP_REASONS.find(o => o.id === d.r);
      const line = k => {
        const parts = [];
        if (hasTime) parts.push(DEP_TPL[k].replace("{t}", timeFmt[k]));
        if (r) parts.push(`${DEP_REASON_LABEL[k]}: ${r[k]}`);
        return parts.join(" · ");
      };
      summary = `
        <div class="mt-3 rounded-2xl bg-white border border-char-300 p-4 fade">
          <div class="text-[11.5px] font-black tracking-wide text-char-400 mb-1 flex items-center gap-1"><i data-lucide="notebook-pen" class="w-3.5 h-3.5"></i>${bi("memo")}</div>
          <p class="text-[16px] font-bold text-char-900">${esc(line("ko"))}</p>
          <p lang="${LANGS[L].html}" class="text-[17px] text-char-600 font-semibold mt-0.5">${esc(line(L))}</p>
        </div>${hasTime ? replyBox(DEP_REPLY, big) : ""}`;
    }
    return wrap(bi("pickDep"), `
      <div class="text-[12px] font-bold text-char-400 mb-1.5">${bi("ampm")}</div>
      <div class="grid grid-cols-2 gap-2 mb-3">${apBtn("am","오전")}${apBtn("pm","오후")}</div>
      <div class="text-[12px] font-bold text-char-400 mb-1.5">${bi("hour")}</div>
      <div class="grid grid-cols-6 gap-2 mb-3">${hourBtns}</div>
      <div class="text-[12px] font-bold text-char-400 mb-1.5">${bi("minute")}</div>
      <div class="grid grid-cols-4 gap-2 mb-4">${minBtns}</div>
      <div class="text-[12px] font-bold text-char-400 mb-1.5">${bi("reason")}</div>
      <div class="grid grid-cols-2 gap-2">${reasons}</div>
      ${summary}`, "clock");
  }
  return "";
}

function cardHTML(ln, n) {
  const L = S.lang;
  return `
  <article class="bg-white rounded-3xl border border-char-200 shadow-soft overflow-hidden fade">
    <div class="flex items-center justify-between gap-3 px-5 md:px-6 pt-4">
      <div class="flex items-center gap-2">
        <span class="text-[12px] font-black text-char-300 tabular-nums">${String(n).padStart(2,"0")}</span>
        <span class="text-[12.5px] font-bold text-char-800 bg-lemon-200 rounded-md px-2.5 py-0.5">${esc(ln.tag)} <span class="font-semibold text-char-600">· ${esc(TAG_T[ln.id][L])}</span></span>
      </div>
    </div>
    <div class="flex gap-4 px-5 md:px-6 pb-5 pt-2.5">
      <div class="flex-1 min-w-0">
        <p class="text-[19px] md:text-[20px] font-bold leading-relaxed text-char-900">${esc(ln.ko)}</p>
        <div class="mt-3 rounded-2xl bg-char-50 border-l-[4px] border-lemon-400 px-4 py-3">
          <div class="text-[10.5px] font-black tracking-widest text-char-400 mb-0.5">${LANGS[L].flag} ${LANGS[L].label.toUpperCase()}</div>
          <p lang="${LANGS[L].html}" class="text-[20px] md:text-[22px] font-semibold leading-relaxed text-char-800">${esc(ln[L])}</p>
          ${L === "zh" && S.pinyin ? `<p class="text-[14.5px] text-char-400 mt-1 leading-relaxed">${esc(ln.py)}</p>` : ""}
        </div>
        ${pickerHTML(ln, false)}
      </div>
      <div class="flex flex-col gap-2 shrink-0">
        <button data-act="show" data-id="${ln.id}" class="ibtn !bg-char-800 !border-char-800 !text-lemon" aria-label="고객에게 크게 보여주기"><i data-lucide="maximize-2" class="w-5 h-5 pointer-events-none"></i></button>
      </div>
    </div>
  </article>`;
}

function renderMain() {
  const sec = SECTIONS.find(s => s.id === S.sec) || SECTIONS[0];
  const n = SECTIONS.indexOf(sec);
  document.getElementById("sectionHead").innerHTML = `
    <div class="rounded-3xl bg-char-800 text-white p-6 md:p-7 shadow-soft relative overflow-hidden">
      <div class="absolute -right-6 -bottom-8 text-[110px] font-black tracking-tighter text-white/[.04] select-none leading-none">DERNA</div>
      <div class="absolute left-0 top-0 bottom-0 w-[5px] bg-lemon"></div>
      <div class="relative flex items-end justify-between gap-4">
        <div>
          <div class="text-[11.5px] font-black tracking-[.24em] text-lemon">STEP ${String(n+1).padStart(2,"0")} / ${String(SECTIONS.length).padStart(2,"0")}</div>
          <h2 class="text-[26px] md:text-[28px] font-extrabold tracking-tight mt-1">${sec.ko}</h2>
          <p class="text-[16px] text-white/70 mt-0.5">${LANGS[S.lang].flag} ${esc(sec.t[S.lang])}</p>
        </div>
        <div class="w-14 h-14 rounded-2xl bg-lemon text-char-900 flex items-center justify-center shrink-0"><i data-lucide="${sec.icon}" class="w-7 h-7"></i></div>
      </div>
    </div>`;
  document.getElementById("cards").innerHTML = sec.lines.map((l, i) => cardHTML(l, i + 1)).join("");
}

function renderModal() {
  const m = document.getElementById("modal");
  if (!modalId) { m.classList.add("hidden"); return; }
  const ln = LINE_MAP[modalId], L = S.lang;
  document.getElementById("modalBody").innerHTML = `
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <span class="inline-flex items-center gap-1.5 text-[13px] font-bold text-char-900 bg-lemon rounded-full px-3 py-1.5"><i data-lucide="presentation" class="w-4 h-4"></i>${bi("showGuest")}</span>
      <span class="text-[13px] font-bold text-char-600 bg-char-100 rounded-full px-3 py-1.5">${esc(ln.tag)} · ${esc(TAG_T[ln.id][L])}</span>
    </div>
    <p class="text-[17px] md:text-[19px] text-char-400 font-semibold leading-relaxed">${esc(ln.ko)}</p>
    <div class="flex items-start gap-4 mt-4">
      <p lang="${LANGS[L].html}" class="flex-1 text-[30px] md:text-[38px] font-bold leading-snug text-char-900">${esc(ln[L])}</p>
    </div>
    ${L === "zh" && S.pinyin ? `<p class="text-[18px] text-char-400 mt-2">${esc(ln.py)}</p>` : ""}
    ${pickerHTML(ln, true)}`;
  m.classList.remove("hidden");
}

function render() {
  renderLang(); renderNav(); renderOpts(); renderMain(); renderModal();
  drawIcons();
}

function drawIcons() {
  document.querySelectorAll("i[data-lucide]").forEach(el => {
    const body = ICON_SVG[el.dataset.lucide]; if (!body) return;
    el.outerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${el.className}" aria-hidden="true">${body}</svg>`;
  });
}

/* =========================================================
   이벤트
   ========================================================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, val = el.dataset.val;
  switch (act) {
    case "lang":
      if (S.lang === val) return;
      S.lang = val; break;
    case "nav":
      S.sec = val; save(); render(); window.scrollTo({ top:0, behavior:"smooth" }); return;
    case "pinyin":
      S.pinyin = !S.pinyin; break;
    case "show":
      modalId = id; break;
    case "close":
      modalId = null; break;
    case "pick":
      if (S.picks[id] === val) delete S.picks[id]; else S.picks[id] = val; break;
    case "multi": {
      const cur = Array.isArray(S.picks[id]) ? S.picks[id] : [];
      S.picks[id] = cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val];
      if (!S.picks[id].length) delete S.picks[id];
      break;
    }
    case "dep": {
      const cur = (S.picks[id] && typeof S.picks[id] === "object") ? { ...S.picks[id] } : {};
      const [k, raw] = val.split(":");
      const nv = (k === "h" || k === "m") ? Number(raw) : raw;
      cur[k] = cur[k] === nv ? undefined : nv;
      if (k === "h" && cur.h !== undefined && cur.m === undefined) cur.m = 0;
      S.picks[id] = cur; break;
    }
    case "clear":
      delete S.picks[id]; break;
    default: return;
  }
  save(); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalId) { modalId = null; render(); } });

let tt;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(tt); tt = setTimeout(() => t.style.opacity = "0", 1600);
}

render();
</script>
